version: '3.8'

services:
  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ninja-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    depends_on:
      - ai-service
    restart: unless-stopped
    networks:
      - ninja-network

  # Python AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ninja-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ai-service/src:/app/src
    restart: unless-stopped
    networks:
      - ninja-network

  # Redis (для кеша и очередей - опционально)
  redis:
    image: redis:7-alpine
    container_name: ninja-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ninja-network
    volumes:
      - redis-data:/data

networks:
  ninja-network:
    driver: bridge

volumes:
  redis-data:
